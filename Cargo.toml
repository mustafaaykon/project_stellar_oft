[workspace]
resolver = "2"
members = ["contracts/mock-lz-endpoint", "contracts/sac-manager", "contracts/oft"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mertkaya/oft-testkit"

[workspace.dependencies]
soroban-sdk = { version = "25.3.0", features = ["hazmat-address"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
